name: Build macOS installer

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create macOS icon
        run: |
          mkdir -p build/icon.iconset
          sips -z 16 16 logo.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32 logo.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 logo.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64 logo.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 logo.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256 logo.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 logo.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512 logo.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 logo.png --out build/icon.iconset/icon_512x512.png
          cp logo.png build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Build DMG
        run: npm run dist:mac

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Generador-Informes-macOS
          path: dist/*.dmg
